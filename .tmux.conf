# ── Prefix ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space

# ── Key Bindings ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind -r n next-window
bind -r p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -r h resize-pane -L 24
bind -r j resize-pane -D 12
bind -r k resize-pane -U 12
bind -r l resize-pane -R 24

# ── Vi Mode & Tmux-Vim Navigation ────────────────────────────────────
set -s escape-time 0
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ── Terminal Settings ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
setw -g monitor-activity on
setw -g aggressive-resize on

# ── Status Bar — Catppuccin Mocha ─────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-interval 3
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 100

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#313244,fg=#cdd6f4"

set -g status-left "#[fg=#a6e3a1,bg=#1e1e2e]#[bg=#a6e3a1,fg=#11111b,bold] #S#[fg=#a6e3a1,bg=#1e1e2e] "
set -g status-right "#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | xargs -I{} echo '#[fg=#89b4fa,bg=#1e1e2e]#[fg=#11111b,bg=#89b4fa,bold] {}#[fg=#89b4fa,bg=#1e1e2e] ')"

setw -g window-status-format         "#[fg=#313244,bg=#1e1e2e]#[fg=#6c7086,bg=#313244]#I #W#[fg=#313244,bg=#1e1e2e]"
setw -g window-status-current-format "#[fg=#b4befe,bg=#1e1e2e]#[fg=#11111b,bg=#b4befe,bold]#I #W#[fg=#b4befe,bg=#1e1e2e]"
setw -g window-status-separator " "
setw -g window-status-activity-style "fg=#fab387,bg=#1e1e2e,none"

# ── Plugin (manual, no TPM) ───────────────────────────────────────────
run-shell ~/.tmux/plugins/tmux-nerd-font-window-name/tmux-nerd-font-window-name.tmux
